<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vendedor1 — Links</title>
<style>
  :root {
    --bg: #0b0f19;
    --card: #141a2a;
    --border: rgba(255,255,255,0.08);
    --text: #e6e9f0;
    --text-muted: #8b93a7;
    --accent: #22d3ee;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% -10%, rgba(34,211,238,0.18), transparent 45%), var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 3rem 1.25rem;
  }
  main { width: 100%; max-width: 480px; text-align: center; }
  .avatar {
    width: 88px;
    height: 88px;
    margin: 0 auto 1rem;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #6366f1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.2rem;
  }
  h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
  p.subtitle { color: var(--text-muted); margin: 0 0 2rem; font-size: 0.95rem; }
  .links { display: flex; flex-direction: column; gap: 0.85rem; }
  .link-btn {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.9rem 1.1rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .link-btn:hover { transform: translateY(-2px); border-color: var(--accent); }
  .link-btn svg { flex: 0 0 auto; width: 22px; height: 22px; }
  .link-btn span { flex: 1; text-align: left; }
  footer { margin-top: 2.5rem; color: var(--text-muted); font-size: 0.8rem; }
</style>
</head>

<main>
