services:
  linktree:
    build: .
    command: >
      streamlit run linktree.py
      --server.address=0.0.0.0
      --server.port=8503
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/ofertas.db
    volumes:
      - ofertas_data:/app/data
    restart: unless-stopped

  loja:
    build: .
    command: >
      streamlit run loja.py
      --server.address=0.0.0.0
      --server.port=8502
      --server.baseUrlPath=site
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/ofertas.db
    volumes:
      - ofertas_data:/app/data
    restart: unless-stopped

  dashboard:
    build: .
    command: >
      streamlit run dashboard.py
      --server.address=0.0.0.0
      --server.port=8501
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/ofertas.db
    volumes:
      - ofertas_data:/app/data
    restart: unless-stopped

  worker:
    build: .
    command: python main.py --loop
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/ofertas.db
    volumes:
      - ofertas_data:/app/data
    restart: unless-stopped

  whatsapp:
    build: ./whatsapp-service
    env_file: .env
    environment:
      AUTH_DIR: /app/auth_info
    volumes:
      - whatsapp_auth:/app/auth_info
    restart: unless-stopped
    # Sem "ports": só acessível pelos outros serviços na rede interna do
    # compose (http://whatsapp:3000), nunca exposto publicamente.

volumes:
  ofertas_data:
  whatsapp_auth:
